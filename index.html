<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        #map {
            flex-grow: 1;
            height: 100%;
        }
        #coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        #sidebar {
            width: 350px;
            background: #fff;
            padding: 15px;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 900;
            height: 100vh;
            box-sizing: border-box;
        }
        .search-box {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }
        .search-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .search-box button {
            width: 100%;
            padding: 8px;
            border: none;
            background-color: #0078A8;
            color: white;
            border-radius: 3px;
            cursor: pointer;
        }
        .search-box button:hover {
            background-color: #005f85;
        }
        .search-message {
            margin-top: 5px;
            font-size: 12px;
            color: #d9534f;
        }
        #property-info {
            padding-top: 10px;
        }
        .accordion-item {
            border: none;
            border-bottom: 1px solid #ccc;
        }
        .accordion-button {
            background-color: #f1f1f1;
            color: #444;
            cursor: pointer;
            padding: 10px 15px;
            width: 100%;
            text-align: left;
            border: none;
            outline: none;
            transition: 0.4s;
            font-size: 14px;
        }
        .accordion-button:hover {
            background-color: #ddd;
        }
        .accordion-content {
            padding: 0 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            background-color: white;
        }
        .accordion-content p {
            margin: 10px 0;
        }
        .accordion-button::before {
            content: '▶';
            font-size: 12px;
            color: #777;
            margin-right: 8px;
            transition: transform 0.2s;
            display: inline-block;
        }
        .accordion-button.active::before {
            transform: rotate(90deg);
        }

        /* Custom style for the white ROL tooltip */
        .white-tooltip {
            color: white;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid white;
        }
        /* Style for the tooltip arrow */
        .leaflet-tooltip-bottom:before, .leaflet-tooltip-top:before, .leaflet-tooltip-left:before, .leaflet-tooltip-right:before {
            border-top-color: rgba(0, 0, 0, 0.6) !important;
        }

    </style>
    <title>Visor de Coordenadas y Roles</title>
</head>
<body>
    <div id="container">
        <div id="map"></div>
        <div id="coordinates">Mueva el mouse sobre el mapa para ver las coordenadas.</div>
        
        <div id="sidebar">
            <div class="search-box">
                <h4>Búsqueda por ROL</h4>
                <input type="text" id="rol-input" placeholder="Buscar por ROL" list="rols-list">
                <datalist id="rols-list"></datalist>
                <button onclick="searchRol()">Buscar</button>
                <div id="rol-search-message" class="search-message"></div>
            </div>
            <div class="search-box">
                <h4>Búsqueda por Coordenadas</h4>
                <input type="text" id="coord-input" placeholder="Ej: -39.16 -72.25">
                <button onclick="searchCoordinates()">Buscar</button>
                <div id="coord-search-message" class="search-message"></div>
            </div>
            
            <div id="property-info">
            </div>
        </div>
    </div>

    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="data/SUBDIVISIONESAO20232024_2.js"></script>
    <script>
        var map = L.map('map', {
            zoomControl: false, maxZoom: 28, minZoom: 1
        });
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');

        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        map.addLayer(layer_OpenStreetMap_0);

        map.createPane('pane_GoogleSatellite_1');
        map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
        var layer_GoogleSatellite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        map.addLayer(layer_GoogleSatellite_1);

        function pop_SUBDIVISIONESAO20232024_2(feature, layer) {
            var popupContent = '<div>\
                <h4>ROL: ' + (feature.properties['ROL'] !== null ? String(feature.properties['ROL']) : '') + '</h4>\
                <div class="accordion-item">\
                    <button class="accordion-button">ZONA PRI</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['ZONA PRI'] !== null ? autolinker.link(String(feature.properties['ZONA PRI']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">ZONA</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['ZONA'] !== null ? autolinker.link(String(feature.properties['ZONA']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">ESTADO LAGO</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['ESTADO LAG'] !== null ? autolinker.link(String(feature.properties['ESTADO LAG']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">CONSTRUCCIONES</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['CONSTRUCCI'] !== null ? autolinker.link(String(feature.properties['CONSTRUCCI']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">APROBACIÓN</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['APROBACION'] !== null ? autolinker.link(String(feature.properties['APROBACION']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">FECHA</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['FECHA'] !== null ? autolinker.link(String(feature.properties['FECHA']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">UBICACIÓN</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['UBICACIÓN'] !== null ? autolinker.link(String(feature.properties['UBICACIÓN']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">PROPIETARIO</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['PROPIETARI'] !== null ? autolinker.link(String(feature.properties['PROPIETARI']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">SUPERFICIE</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['SUPERFICIE'] !== null ? autolinker.link(String(feature.properties['SUPERFICIE']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">DESTINO</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['DESTINO '] !== null ? autolinker.link(String(feature.properties['DESTINO ']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">RECEPCIÓN</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['RECEPCIÓN'] !== null ? autolinker.link(String(feature.properties['RECEPCIÓN']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                <div class="accordion-item">\
                    <button class="accordion-button">PELIGRO VOLCÁNICO</button>\
                    <div class="accordion-content">\
                        <p>' + (feature.properties['PELIGRO VO'] !== null ? autolinker.link(String(feature.properties['PELIGRO VO']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
            </div>';

            var propertyInfoDiv = document.getElementById('property-info');
            propertyInfoDiv.innerHTML = popupContent;
            initializeAccordion();
        }
        
        var defaultStyle = {
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            opacity: 1,
            color: 'rgba(255,1,1,1.0)',
            dashArray: '',
            lineCap: 'butt',
            lineJoin: 'miter',
            weight: 1.0,
            fill: true,
            fillOpacity: 1,
            fillColor: 'rgba(114,155,111,0.0)',
            interactive: true,
        };

        // Style for when a polygon is clicked and highlighted
        var highlightStyle = {
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            opacity: 1,
            color: 'rgba(0, 0, 255, 1.0)',
            dashArray: '',
            lineCap: 'butt',
            lineJoin: 'miter',
            weight: 3.0,
            fill: true,
            fillOpacity: 0.2,
            fillColor: 'rgba(0, 0, 255, 0.5)',
            interactive: true,
        };

        // Style for when a polygon is hovered over
        var hoverStyle = {
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            opacity: 1,
            color: 'rgba(255,255,255,1.0)', // White border on hover
            dashArray: '',
            lineCap: 'butt',
            lineJoin: 'miter',
            weight: 2.0,
            fill: true,
            fillOpacity: 0.2,
            fillColor: 'rgba(255,255,255,0.5)', // Light white fill on hover
            interactive: true,
        };

        function style_SUBDIVISIONESAO20232024_2_0(feature) {
            return defaultStyle;
        }

        map.createPane('pane_SUBDIVISIONESAO20232024_2');
        map.getPane('pane_SUBDIVISIONESAO20232024_2').style.zIndex = 402;
        map.getPane('pane_SUBDIVISIONESAO20232024_2').style['mix-blend-mode'] = 'normal';
        
        var layer_SUBDIVISIONESAO20232024_2 = new L.geoJson(json_SUBDIVISIONESAO20232024_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_SUBDIVISIONESAO20232024_2',
            layerName: 'layer_SUBDIVISIONESAO20232024_2',
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            onEachFeature: function (feature, layer) {
                if (feature.properties['ROL']) {
                    layer.bindTooltip("ROL: " + feature.properties['ROL'], {
                        permanent: false,
                        direction: 'center',
                        className: 'white-tooltip'
                    });
                }
                layer.on('mouseover', function(e) {
                    e.target.setStyle(hoverStyle);
                    e.target.openTooltip();
                });
                layer.on('mouseout', function(e) {
                    // Only reset style if it's not the currently clicked and highlighted layer
                    if (highlightedLayer && e.target !== highlightedLayer) {
                         layer_SUBDIVISIONESAO20232024_2.resetStyle(e.target);
                    } else if (!highlightedLayer) {
                        layer_SUBDIVISIONESAO20232024_2.resetStyle(e.target);
                    }
                    e.target.closeTooltip();
                });
                layer.on('click', function(e) {
                    pop_SUBDIVISIONESAO20232024_2(feature, layer);
                    map.fitBounds(e.target.getBounds());
                    
                    if (highlightedLayer) {
                        layer_SUBDIVISIONESAO20232024_2.resetStyle(highlightedLayer);
                    }
                    
                    highlightedLayer = layer;
                    layer.setStyle(highlightStyle);
                });
            },
            style: style_SUBDIVISIONESAO20232024_2_0,
        });
        bounds_group.addLayer(layer_SUBDIVISIONESAO20232024_2);
        map.addLayer(layer_SUBDIVISIONESAO20232024_2);
        
        map.fitBounds(layer_SUBDIVISIONESAO20232024_2.getBounds());

        var overlaysTree = {
            label: 'Capas', children: [
                {label: '<img src="legend/SUBDIVISIONESAO20232024_2.png" /> SUBDIVISIONES AÑO 2023-2024', layer: layer_SUBDIVISIONESAO20232024_2},
            ]
        };

        var baseTree = {
            label: 'Mapas Base', children: [
                {label: "Google Satellite", layer: layer_GoogleSatellite_1},
                {label: "OpenStreetMap", layer: layer_OpenStreetMap_0},
            ]
        };

        var lay = L.control.layers.tree(baseTree, overlaysTree,{
            collapsed: true,
        });
        lay.addTo(map);

        var coordinatesDiv = document.getElementById('coordinates');
        var highlightedLayer = null;

        map.on('mousemove', function(e) {
            var lat = e.latlng.lat.toFixed(6);
            var lng = e.latlng.lng.toFixed(6);
            coordinatesDiv.innerHTML = `Latitud: ${lat}<br>Longitud: ${lng}`;
        });
        
        var rolSearchMessageDiv = document.getElementById('rol-search-message');
        var coordSearchMessageDiv = document.getElementById('coord-search-message');
        
        function populateDatalist() {
            var datalist = document.getElementById('rols-list');
            var roles = new Set();
            if (json_SUBDIVISIONESAO20232024_2 && json_SUBDIVISIONESAO20232024_2.features) {
                json_SUBDIVISIONESAO20232024_2.features.forEach(function(feature) {
                    if (feature.properties['ROL']) {
                        roles.add(feature.properties['ROL']);
                    }
                });
            }
            roles.forEach(function(rol) {
                var option = document.createElement('option');
                option.value = rol;
                datalist.appendChild(option);
            });
        }
        
        populateDatalist();

        function searchRol() {
            var rolInput = document.getElementById('rol-input').value.trim();
            var found = false;
            
            if (highlightedLayer) {
                layer_SUBDIVISIONESAO20232024_2.resetStyle(highlightedLayer);
                highlightedLayer = null;
            }
            
            rolSearchMessageDiv.innerHTML = "";
            coordSearchMessageDiv.innerHTML = "";
            
            layer_SUBDIVISIONESAO20232024_2.eachLayer(function(layer) {
                if (layer.feature.properties['ROL'] && layer.feature.properties['ROL'].toString().toLowerCase() === rolInput.toLowerCase()) {
                    map.fitBounds(layer.getBounds());
                    pop_SUBDIVISIONESAO20232024_2(layer.feature, layer);
                    
                    highlightedLayer = layer;
                    layer.setStyle(highlightStyle);
                    
                    found = true;
                    return;
                }
            });

            if (!found) {
                rolSearchMessageDiv.innerHTML = "ROL no encontrado. Intente con otro valor.";
                rolSearchMessageDiv.style.color = 'red';
            }
        }

        function searchCoordinates() {
            var inputString = document.getElementById('coord-input').value.trim();
            var coords = inputString.split(/\s+/).map(Number);

            if (highlightedLayer) {
                layer_SUBDIVISIONESAO20232024_2.resetStyle(highlightedLayer);
                highlightedLayer = null;
            }
            
            rolSearchMessageDiv.innerHTML = "";
            coordSearchMessageDiv.innerHTML = "";
            document.getElementById('property-info').innerHTML = '';

            if (coords.length !== 2 || isNaN(coords[0]) || isNaN(coords[1]) || coords[0] < -90 || coords[0] > 90 || coords[1] < -180 || coords[1] > 180) {
                coordSearchMessageDiv.innerHTML = "Formato no válido. Ingrese Latitud y Longitud separadas por un espacio.";
                coordSearchMessageDiv.style.color = 'red';
                return;
            }

            var latInput = coords[0];
            var lonInput = coords[1];

            var newCenter = L.latLng(latInput, lonInput);
            map.setView(newCenter, 16);
        }
        
        map.on('click', function() {
            if (highlightedLayer) {
                layer_SUBDIVISIONESAO20232024_2.resetStyle(highlightedLayer);
                highlightedLayer = null;
                document.getElementById('property-info').innerHTML = '';
            }
        });
        
        function initializeAccordion() {
            var acc = document.getElementsByClassName("accordion-button");
            for (var i = 0; i < acc.length; i++) {
                acc[i].addEventListener("click", function() {
                    this.classList.toggle("active");
                    var content = this.nextElementSibling;
                    if (content.style.maxHeight) {
                        content.style.maxHeight = null;
                    } else {
                        content.style.maxHeight = content.scrollHeight + "px";
                    } 
                });
            }
        }

        setBounds();
    </script>
</body>
</html>
