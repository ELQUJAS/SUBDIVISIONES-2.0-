<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <style>
        /* Base Styles */
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            overflow: hidden;
            background-color: #f0f2f5; /* Fondo general del body, más claro */
        }

        /* Header Styles - Similar to image */
        #header {
            background-color: #007bff; /* Azul vibrante */
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1001; /* Asegura que esté por encima de todo */
            border-bottom-left-radius: 15px; /* Redondeado en la esquina inferior izquierda */
            border-bottom-right-radius: 15px; /* Redondeado en la esquina inferior derecha */
        }
        #header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #header-icons {
            display: flex;
            align-items: center;
        }
        #header-icons .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 25px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            transition: color 0.2s;
        }
        #header-icons .icon-item:hover {
            color: white;
        }
        #header-icons .icon-item i {
            font-size: 24px;
            margin-bottom: 5px;
        }
        #header-icons .icon-item span {
            font-size: 12px;
            font-weight: 500;
        }

        /* Main Container for Map and Sidebar */
        #main-content-container {
            display: flex;
            width: calc(100% - 40px); /* Ajuste para el padding del body si lo hubiera */
            height: calc(100vh - 100px); /* Ajusta para el header y el margen inferior */
            margin: 20px auto; /* Centrar y dar margen */
            border-radius: 15px; /* Bordes redondeados en el contenedor principal */
            overflow: hidden; /* Importante para que los bordes redondeados funcionen bien */
            box-shadow: 0 8px 25px rgba(0,0,0,0.15); /* Sombra más pronunciada */
            background-color: #fff; /* Fondo blanco para el contenedor */
        }

        /* Map Styles */
        #map {
            flex-grow: 1;
            height: 100%;
            min-width: 500px; /* Asegura un tamaño mínimo para el mapa */
            background-color: #e6e9ed; /* Fondo sutil para el área del mapa */
        }

        /* Coordinates Display */
        #coordinates {
            position: fixed; /* Cambiado a fixed para que se mantenga fijo */
            bottom: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            color: #555;
        }
        
        /* Sidebar Styles */
        #sidebar {
            width: 380px;
            background: #ffffff; /* Fondo blanco para el sidebar */
            padding: 25px; /* Más padding */
            overflow-y: auto;
            z-index: 900;
            box-sizing: border-box;
            border-left: 1px solid #e0e0e0; /* Borde sutil a la izquierda */
            border-top-right-radius: 15px; /* Bordes redondeados arriba y abajo a la derecha */
            border-bottom-right-radius: 15px;
        }

        /* Search Box Styles */
        .search-box {
            background: #f9fbfd; /* Fondo muy claro para los cuadros de búsqueda */
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #e8edf2; /* Borde muy sutil */
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); /* Sombra interna sutil */
        }
        .search-box h4 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            color: #2c3e50; /* Color de título oscuro */
            font-weight: 700;
            border-bottom: 2px solid #007bff; /* Subrayado azul */
            padding-bottom: 8px;
            display: inline-block; /* Para que el subrayado se ajuste al texto */
        }
        .search-box label {
            display: block;
            font-size: 13px;
            color: #6a7a8d; /* Texto de label más sutil */
            margin-bottom: 5px;
            font-weight: 500;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #dcdfe6; /* Borde más sutil */
            border-radius: 8px; /* Bordes más redondeados */
            font-size: 14px;
            color: #495057;
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box input:focus {
            border-color: #007bff; /* Azul al enfocar */
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25); /* Resaltado de foco */
            outline: none;
        }
        .search-box button {
            width: 100%;
            padding: 12px 15px;
            border: none;
            color: white;
            border-radius: 8px; /* Bordes más redondeados */
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* Sombra para botones */
        }
        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        .search-box button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* Específico para botones de búsqueda */
        .search-box button:first-of-type { /* Botón de Coordenadas */
            background-color: #007bff; /* Azul */
        }
        .search-box button:first-of-type:hover {
            background-color: #0069d9;
        }
        .search-box button:last-of-type { /* Botón de ROL */
            background-color: #28a745; /* Verde */
        }
        .search-box button:last-of-type:hover {
            background-color: #218838;
        }
        .search-message {
            margin-top: 10px;
            font-size: 13px;
            color: #dc3545; /* Rojo de error */
            font-weight: 500;
        }

        /* Property Info and Accordion Styles */
        #property-info {
            padding-top: 15px;
            border-top: 1px solid #f0f2f5; /* Separador más sutil */
        }
        #property-info h4 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #007bff; /* Subrayado azul */
            display: inline-block;
            font-weight: 700;
        }
        .accordion-item {
            border: 1px solid #e0e0e0; /* Borde general del item */
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .accordion-button {
            background-color: #fcfcfc; /* Fondo muy claro para el botón */
            color: #333;
            cursor: pointer;
            padding: 12px 18px;
            width: 100%;
            text-align: left;
            border: none;
            outline: none;
            transition: background-color 0.3s, color 0.3s;
            font-size: 15px;
            font-weight: 500;
            display: flex; /* Para alinear el chevron a la derecha */
            justify-content: space-between;
            align-items: center;
        }
        .accordion-button:hover {
            background-color: #f0f0f0;
        }
        .accordion-button.active {
            background-color: #e0f2f7; /* Fondo azul claro cuando está activo */
            color: #0056b3; /* Texto azul oscuro */
            border-bottom: 1px solid #b3e0ed; /* Borde inferior al abrir */
            border-radius: 8px 8px 0 0; /* Solo esquinas superiores redondeadas cuando activo */
        }
        .accordion-content {
            padding: 10px 18px; /* Ajuste de padding */
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out; /* Transición para padding */
            background-color: #fefefe; /* Fondo más blanco para el contenido */
            border-top: 1px solid #f0f0f0; /* Separador sutil */
        }
        .accordion-content.open { /* Clase para cuando el contenido está abierto */
             max-height: 500px; /* Un valor grande para mostrar todo el contenido */
             padding: 10px 18px;
        }
        .accordion-content p {
            margin: 8px 0; /* Espaciado entre párrafos */
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
        .accordion-content p b {
            color: #333;
            font-weight: 600;
        }
        /* Chevron (flecha) icon for accordion */
        .accordion-button::after {
            content: '\f078'; /* Usamos el ícono de chevron down de Font Awesome */
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            font-size: 14px;
            color: #888;
            margin-left: 10px;
            transition: transform 0.2s ease-in-out;
            transform: rotate(270deg);
        }
        .accordion-button.active::after {
            transform: rotate(0deg); /* Gira a 0 grados (abajo) cuando está activo */
        }

        /* Tooltip Styles (for ROL on map) */
        .white-tooltip {
            color: white;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.75); /* Fondo más oscuro */
            border: 1px solid #fff; /* Borde blanco */
            border-radius: 5px; /* Bordes redondeados */
            padding: 5px 8px;
            font-size: 13px;
        }
        .leaflet-tooltip-bottom:before, .leaflet-tooltip-top:before, .leaflet-tooltip-left:before, .leaflet-tooltip-right:before {
            border-top-color: rgba(0, 0, 0, 0.75) !important;
        }

        /* Leaflet Controls Customization */
        .leaflet-control-zoom {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            margin-left: 15px; /* Ajuste de posición */
            margin-top: 15px;
        }
        .leaflet-control-zoom a {
            color: #555;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }
        .leaflet-control-zoom a:hover {
            background-color: #f5f5f5;
            color: #333;
        }
        .leaflet-control-zoom a.leaflet-control-zoom-out {
            border-radius: 0 0 8px 8px;
        }
        .leaflet-control-zoom a.leaflet-control-zoom-in {
            border-radius: 8px 8px 0 0;
        }
        .leaflet-control-layers {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background-color: #fff;
            color: #333;
        }
        .leaflet-control-layers-toggle {
            background-color: #fff;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%23333"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>'); /* Icono de info */
            background-size: 20px 20px;
            background-position: center;
            background-repeat: no-repeat;
            width: 36px;
            height: 36px;
            border-radius: 8px; /* Para que el toggle también tenga bordes redondeados */
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        /* Ajuste específico para el tree control, si usas íconos de Font Awesome en él */
        .leaflet-control-layers-tree label i {
            margin-right: 5px;
            color: #555;
        }
    </style>
    <title>Visor de Coordenadas y Roles</title>
</head>
<body>
    <div id="header">
        <h1>INFORMACIÓN TERRITORIAL DE LA COMUNA DE VILLARRICA</h1>
        <div id="header-icons">
            <a href="#" class="icon-item">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="#" class="icon-item">
                <i class="fas fa-search"></i>
                <span>Buscar Rol</span>
            </a>
        </div>
    </div>

    <div id="main-content-container">
        <div id="map"></div>
        <div id="coordinates">Mueva el mouse sobre el mapa para ver las coordenadas.</div>
        
        <div id="sidebar">
            <div class="search-box">
                <h4>Buscadores</h4>
                <label for="coord-input">Latitud, Longitud (Ej: -33.21 -71.24)</label>
                <input type="text" id="coord-input" placeholder="Latitud, Longitud">
                <button onclick="searchCoordinates()">Buscar</button>
                <div id="coord-search-message" class="search-message"></div>
                
                <label for="rol-input" style="margin-top: 20px;">Buscar ROL (Ej: 1234-5)</label>
                <input type="text" id="rol-input" placeholder="Buscar ROL" list="rols-list">
                <datalist id="rols-list"></datalist>
                <button onclick="searchRol()">Buscar ROL</button>
                <div id="rol-search-message" class="search-message"></div>
            </div>
            
            <div id="property-info">
                <h4>Información de ROL</h4>
            </div>
        </div>
    </div>

    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="data/SUBDIVISIONESAO20232024_2.js"></script>
    <script>
        var map = L.map('map', {
            zoomControl: false, maxZoom: 28, minZoom: 1
        });
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');

        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        map.addLayer(layer_OpenStreetMap_0);

        map.createPane('pane_GoogleSatellite_1');
        map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
        var layer_GoogleSatellite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        map.addLayer(layer_GoogleSatellite_1);

        function pop_SUBDIVISIONESAO20232024_2(feature, layer) {
            var popupContent = '<div>\
                <h4>ROL: ' + (feature.properties['ROL'] !== null ? String(feature.properties['ROL']) : '') + '</h4>\
                \
                <div class="accordion-item">\
                    <button class="accordion-button">Gestión Territorial</button>\
                    <div class="accordion-content">\
                        <p><b>ZONA PRI VILLARRICA-PUCÓN:</b> ' + (feature.properties['ZONA PRI'] !== null ? autolinker.link(String(feature.properties['ZONA PRI']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                        <p><b>SECTOR:</b> ' + (feature.properties['ZONA'] !== null ? autolinker.link(String(feature.properties['ZONA']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                        <p><b>ZONA LAGO SATURADO:</b> ' + (feature.properties['ESTADO LAG'] !== null ? autolinker.link(String(feature.properties['ESTADO LAG']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                        <p><b>PELIGRO VOLCÁNICO:</b> ' + (feature.properties['PELIGRO VO'] !== null ? autolinker.link(String(feature.properties['PELIGRO VO']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
                \
                <div class="accordion-item">\
                    <button class="accordion-button">Construcciones</button>\
                    <div class="accordion-content">\
                        <p><b>NÚMERO DE CONSTRUCCIONES:</b> ' + (feature.properties['CONSTRUCCI'] !== null ? autolinker.link(String(feature.properties['CONSTRUCCI']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                        <p><b>PERMISO DE EDIFICACIÓN:</b> ' + (feature.properties['APROBACION'] !== null ? autolinker.link(String(feature.properties['APROBACION']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                        <p><b>RECEPCIÓN DEFINITIVA:</b> ' + (feature.properties['RECEPCIÓN'] !== null ? autolinker.link(String(feature.properties['RECEPCIÓN']).replace(/'/g, '\'').toLocaleString()) : 'N/A') + '</p>\
                    </div>\
                </div>\
            </div>';

            var propertyInfoDiv = document.getElementById('property-info');
            propertyInfoDiv.innerHTML = popupContent;
            initializeAccordion();
        }
        
        var defaultStyle = {
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            opacity: 1,
            color: 'rgba(255,1,1,1.0)',
            dashArray: '',
            lineCap: 'butt',
            lineJoin: 'miter',
            weight: 1.0,
            fill: true,
            fillOpacity: 1,
            fillColor: 'rgba(114,155,111,0.0)',
            interactive: true,
        };

        var highlightStyle = {
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            opacity: 1,
            color: 'rgba(0, 0, 255, 1.0)',
            dashArray: '',
            lineCap: 'butt',
            lineJoin: 'miter',
            weight: 3.0,
            fill: true,
            fillOpacity: 0.2,
            fillColor: 'rgba(0, 0, 255, 0.5)',
            interactive: true,
        };

        var hoverStyle = {
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            opacity: 1,
            color: 'rgba(255,255,255,1.0)',
            dashArray: '',
            lineCap: 'butt',
            lineJoin: 'miter',
            weight: 2.0,
            fill: true,
            fillOpacity: 0.2,
            fillColor: 'rgba(255,255,255,0.5)',
            interactive: true,
        };

        function style_SUBDIVISIONESAO20232024_2_0(feature) {
            return defaultStyle;
        }

        map.createPane('pane_SUBDIVISIONESAO20232024_2');
        map.getPane('pane_SUBDIVISIONESAO20232024_2').style.zIndex = 402;
        map.getPane('pane_SUBDIVISIONESAO20232024_2').style['mix-blend-mode'] = 'normal';
        
        var highlightedLayer = null;
        var coordMarker = null;

        var layer_SUBDIVISIONESAO20232024_2 = new L.geoJson(json_SUBDIVISIONESAO20232024_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_SUBDIVISIONESAO20232024_2',
            layerName: 'layer_SUBDIVISIONESAO20232024_2',
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            onEachFeature: function (feature, layer) {
                if (feature.properties['ROL']) {
                    layer.bindTooltip("ROL: " + feature.properties['ROL'], {
                        permanent: false,
                        direction: 'center',
                        className: 'white-tooltip'
                    });
                }
                
                layer.on({
                    click: function (e) {
                        if (highlightedLayer) {
                            layer_SUBDIVISIONESAO20232024_2.resetStyle(highlightedLayer);
                        }
                        
                        e.target.setStyle(highlightStyle);
                        highlightedLayer = e.target;
                        
                        pop_SUBDIVISIONESAO20232024_2(e.target.feature, e.target);
                        
                        map.fitBounds(e.target.getBounds());

                        // Remove coordMarker if it exists
                        if (coordMarker) {
                            map.removeLayer(coordMarker);
                            coordMarker = null;
                        }
                        
                        L.DomEvent.stopPropagation(e);
                    },
                    mouseover: function (e) {
                        if (e.target !== highlightedLayer) {
                            e.target.setStyle(hoverStyle);
                        }
                        e.target.openTooltip();
                    },
                    mouseout: function (e) {
                        if (e.target !== highlightedLayer) {
                            layer_SUBDIVISIONESAO20232024_2.resetStyle(e.target);
                        }
                        e.target.closeTooltip();
                    }
                });
            },
            style: style_SUBDIVISIONESAO20232024_2_0,
        });
        bounds_group.addLayer(layer_SUBDIVISIONESAO20232024_2);
        map.addLayer(layer_SUBDIVISIONESAO20232024_2);
        
        map.fitBounds(layer_SUBDIVISIONESAO20232024_2.getBounds());

        var overlaysTree = {
            label: 'Capas', children: [
                {label: '<img src="legend/SUBDIVISIONESAO20232024_2.png" /> SUBDIVISIONES AÑO 2023-2024', layer: layer_SUBDIVISIONESAO20232024_2},
            ]
        };

        var baseTree = {
            label: 'Mapas Base', children: [
                {label: "Google Satellite", layer: layer_GoogleSatellite_1},
                {label: "OpenStreetMap", layer: layer_OpenStreetMap_0},
            ]
        };

        var lay = L.control.layers.tree(baseTree, overlaysTree,{
            collapsed: true,
        });
        lay.addTo(map);

        var coordinatesDiv = document.getElementById('coordinates');
        
        map.on('mousemove', function(e) {
            var lat = e.latlng.lat.toFixed(6);
            var lng = e.latlng.lng.toFixed(6);
            coordinatesDiv.innerHTML = `Latitud: ${lat}<br>Longitud: ${lng}`;
        });
        
        map.on('click', function() {
            if (highlightedLayer) {
                layer_SUBDIVISIONESAO20232024_2.resetStyle(highlightedLayer);
                highlightedLayer = null;
                document.getElementById('property-info').innerHTML = '<h4>Información de ROL</h4>'; // Restablece el div de info
            }
            if (coordMarker) {
                map.removeLayer(coordMarker);
                coordMarker = null;
            }
        });

        var rolSearchMessageDiv = document.getElementById('rol-search-message');
        var coordSearchMessageDiv = document.getElementById('coord-search-message');
        
        function populateDatalist() {
            var datalist = document.getElementById('rols-list');
            var roles = new Set();
            if (json_SUBDIVISIONESAO20232024_2 && json_SUBDIVISIONESAO20232024_2.features) {
                json_SUBDIVISIONESAO20232024_2.features.forEach(function(feature) {
                    if (feature.properties['ROL']) {
                        roles.add(feature.properties['ROL']);
                    }
                });
            }
            roles.forEach(function(rol) {
                var option = document.createElement('option');
                option.value = rol;
                datalist.appendChild(option);
            });
        }
        
        populateDatalist();

        function searchRol() {
            var rolInput = document.getElementById('rol-input').value.trim();
            var found = false;
            
            if (highlightedLayer) {
                layer_SUBDIVISIONESAO20232024_2.resetStyle(highlightedLayer);
                highlightedLayer = null;
            }
            
            if (coordMarker) {
                map.removeLayer(coordMarker);
                coordMarker = null;
            }
            
            rolSearchMessageDiv.innerHTML = "";
            coordSearchMessageDiv.innerHTML = "";
            
            layer_SUBDIVISIONESAO20232024_2.eachLayer(function(layer) {
                if (layer.feature.properties['ROL'] && layer.feature.properties['ROL'].toString().toLowerCase() === rolInput.toLowerCase()) {
                    map.fitBounds(layer.getBounds());
                    pop_SUBDIVISIONESAO20232024_2(layer.feature, layer);
                    
                    highlightedLayer = layer;
                    layer.setStyle(highlightStyle);
                    
                    found = true;
                    return;
                }
            });

            if (!found) {
                rolSearchMessageDiv.innerHTML = "ROL no encontrado. Intente con otro valor.";
                rolSearchMessageDiv.style.color = 'red';
            }
        }

        function searchCoordinates() {
            var inputString = document.getElementById('coord-input').value.trim();
            var coords = inputString.split(/\s+/).map(Number);
            
            if (coordMarker) {
                map.removeLayer(coordMarker);
            }
            
            if (highlightedLayer) {
                layer_SUBDIVISIONESAO20232024_2.resetStyle(highlightedLayer);
                highlightedLayer = null;
            }
            
            rolSearchMessageDiv.innerHTML = "";
            coordSearchMessageDiv.innerHTML = "";
            document.getElementById('property-info').innerHTML = '<h4>Información de ROL</h4>'; // Restablece el div de info

            if (coords.length !== 2 || isNaN(coords[0]) || isNaN(coords[1])) {
                coordSearchMessageDiv.innerHTML = "Formato no válido. Ingrese Latitud y Longitud separadas por un espacio.";
                coordSearchMessageDiv.style.color = 'red';
                return;
            }

            var latInput = coords[0];
            var lonInput = coords[1];

            var newCenter = L.latLng(latInput, lonInput);
            map.setView(newCenter, 16);

            var customIcon = L.icon({
                iconUrl: 'https://cdn.rawgit.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                tooltipAnchor: [16, -28],
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                shadowSize: [41, 41]
            });

            coordMarker = L.marker(newCenter, {icon: customIcon}).addTo(map);

            var foundFeature = null;
            var foundLayer = null;
            layer_SUBDIVISIONESAO20232024_2.eachLayer(function(layer) {
                if (layer.getBounds().contains(newCenter)) {
                    foundFeature = layer.feature;
                    foundLayer = layer;
                    return;
                }
            });

            if (foundFeature && foundFeature.properties['ROL']) {
                coordMarker.bindTooltip("ROL: " + foundFeature.properties['ROL'], {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -35]
                }).openTooltip();
                pop_SUBDIVISIONESAO20232024_2(foundFeature, foundLayer);
                highlightedLayer = foundLayer;
                foundLayer.setStyle(highlightStyle);
            } else {
                coordMarker.bindTooltip("No se encontró ROL", {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -35]
                }).openTooltip();
                coordSearchMessageDiv.innerHTML = "No se encontró ROL para esta coordenada.";
                coordSearchMessageDiv.style.color = 'red';
            }
        }
        
        function initializeAccordion() {
            var acc = document.getElementsByClassName("accordion-button");
            for (var i = 0; i < acc.length; i++) {
                // Ensure event listeners are not duplicated
                if (!acc[i].classList.contains('has-listener')) {
                    acc[i].addEventListener("click", function() {
                        this.classList.toggle("active");
                        var content = this.nextElementSibling;
                        if (content.style.maxHeight) {
                            content.style.maxHeight = null;
                            content.classList.remove('open');
                        } else {
                            content.style.maxHeight = content.scrollHeight + "px";
                            content.classList.add('open');
                        } 
                    });
                    acc[i].classList.add('has-listener');
                }
            }
        }

        setBounds();
    </script>
</body>
