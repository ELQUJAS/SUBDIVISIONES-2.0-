<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        #coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        #search-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
        }
        .search-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            margin-top: 5px;
        }
        .search-box input {
            width: 200px;
            padding: 5px;
            margin-right: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .search-box button {
            padding: 5px 10px;
            border: none;
            background-color: #0078A8;
            color: white;
            border-radius: 3px;
            cursor: pointer;
        }
        .search-box button:hover {
            background-color: #005f85;
        }
        .search-message {
            margin-top: 5px;
            font-size: 12px;
            color: #d9534f;
        }
        /* Ajuste para colocar los buscadores debajo de la leyenda */
        .leaflet-control-container .leaflet-top.leaflet-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .leaflet-control-layers {
            margin-bottom: 5px; /* Espacio entre la leyenda y los buscadores */
        }
    </style>
    <title>Visor de Coordenadas y Roles</title>
</head>
<body>
    <div id="map"></div>
    <div id="coordinates">Mueva el mouse sobre el mapa para ver las coordenadas.</div>
    
    <div id="search-container">
        <div class="search-box">
            <input type="text" id="rol-input" placeholder="Buscar por ROL">
            <button onclick="searchRol()">Buscar</button>
            <div id="rol-search-message" class="search-message"></div>
        </div>
        <div class="search-box">
            <input type="text" id="coord-input" placeholder="Ej: -39.16 -72.25">
            <button onclick="searchCoordinates()">Buscar</button>
            <div id="coord-search-message" class="search-message"></div>
        </div>
    </div>

    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="data/SUBDIVISIONESAO20232024_2.js"></script>
    <script>
        var map = L.map('map', {
            zoomControl: false, maxZoom: 28, minZoom: 1
        });
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            if (tempDiv.querySelector('td img')) {
                popup._contentNode.classList.add('media');
                setTimeout(function() {
                    popup.update();
                }, 10);
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);

        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OpenStreetMap_0;
        map.addLayer(layer_OpenStreetMap_0);

        map.createPane('pane_GoogleSatellite_1');
        map.getPane('pane_GoogleSatellite_1').style.zIndex = 401;
        var layer_GoogleSatellite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatellite_1',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_GoogleSatellite_1;
        map.addLayer(layer_GoogleSatellite_1);

        function pop_SUBDIVISIONESAO20232024_2(feature, layer) {
            var popupContent = '<table>\
                <tr><th scope="row">ROL</th><td>' + (feature.properties['ROL'] !== null ? autolinker.link(String(feature.properties['ROL']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">ZONA PRI</th><td>' + (feature.properties['ZONA PRI'] !== null ? autolinker.link(String(feature.properties['ZONA PRI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">ZONA</th><td>' + (feature.properties['ZONA'] !== null ? autolinker.link(String(feature.properties['ZONA']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">ESTADO LAG</th><td>' + (feature.properties['ESTADO LAG'] !== null ? autolinker.link(String(feature.properties['ESTADO LAG']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">CONSTRUCCI</th><td>' + (feature.properties['CONSTRUCCI'] !== null ? autolinker.link(String(feature.properties['CONSTRUCCI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">APROBACION</th><td>' + (feature.properties['APROBACION'] !== null ? autolinker.link(String(feature.properties['APROBACION']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">FECHA</th><td>' + (feature.properties['FECHA'] !== null ? autolinker.link(String(feature.properties['FECHA']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">UBICACIÓN</th><td>' + (feature.properties['UBICACIÓN'] !== null ? autolinker.link(String(feature.properties['UBICACIÓN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">PROPIETARI</th><td>' + (feature.properties['PROPIETARI'] !== null ? autolinker.link(String(feature.properties['PROPIETARI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">SUPERFICIE</th><td>' + (feature.properties['SUPERFICIE'] !== null ? autolinker.link(String(feature.properties['SUPERFICIE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">DESTINO </th><td>' + (feature.properties['DESTINO '] !== null ? autolinker.link(String(feature.properties['DESTINO ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">RECEPCIÓN</th><td>' + (feature.properties['RECEPCIÓN'] !== null ? autolinker.link(String(feature.properties['RECEPCIÓN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">PELIGRO VO</th><td>' + (feature.properties['PELIGRO VO'] !== null ? autolinker.link(String(feature.properties['PELIGRO VO']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_SUBDIVISIONESAO20232024_2_0() {
            return {
                pane: 'pane_SUBDIVISIONESAO20232024_2',
                opacity: 1,
                color: 'rgba(255,1,1,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(114,155,111,0.0)',
                interactive: true,
            };
        }

        map.createPane('pane_SUBDIVISIONESAO20232024_2');
        map.getPane('pane_SUBDIVISIONESAO20232024_2').style.zIndex = 402;
        map.getPane('pane_SUBDIVISIONESAO20232024_2').style['mix-blend-mode'] = 'normal';
        var layer_SUBDIVISIONESAO20232024_2 = new L.geoJson(json_SUBDIVISIONESAO20232024_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_SUBDIVISIONESAO20232024_2',
            layerName: 'layer_SUBDIVISIONESAO20232024_2',
            pane: 'pane_SUBDIVISIONESAO20232024_2',
            onEachFeature: pop_SUBDIVISIONESAO20232024_2,
            style: style_SUBDIVISIONESAO20232024_2_0,
        });
        bounds_group.addLayer(layer_SUBDIVISIONESAO20232024_2);
        map.addLayer(layer_SUBDIVISIONESAO20232024_2);
        
        map.fitBounds(layer_SUBDIVISIONESAO20232024_2.getBounds());

        var overlaysTree = [
            {label: '<img src="legend/SUBDIVISIONESAO20232024_2.png" /> SUBDIVISIONES AÑO 2023-2024', layer: layer_SUBDIVISIONESAO20232024_2},
            {label: "Google Satellite", layer: layer_GoogleSatellite_1},
            {label: "OpenStreetMap", layer: layer_OpenStreetMap_0},
        ];
        var lay = L.control.layers.tree(null, overlaysTree,{
            collapsed: true,
        });
        lay.addTo(map);

        var coordinatesDiv = document.getElementById('coordinates');

        map.on('mousemove', function(e) {
            var lat = e.latlng.lat.toFixed(6);
            var lng = e.latlng.lng.toFixed(6);
            coordinatesDiv.innerHTML = `Latitud: ${lat}<br>Longitud: ${lng}`;
        });
        
        // Mover los buscadores debajo del control de capas
        var searchContainer = document.getElementById('search-container');
        var controlContainer = document.querySelector('.leaflet-control-container .leaflet-top.leaflet-left');
        controlContainer.appendChild(searchContainer);
        
        // Ajustar el margen del contenedor de búsqueda
        searchContainer.style.marginTop = '15px';


        var rolSearchMessageDiv = document.getElementById('rol-search-message');
        var coordSearchMessageDiv = document.getElementById('coord-search-message');
        var searchMarker;

        function searchRol() {
            var rolInput = document.getElementById('rol-input').value.trim();
            var found = false;
            
            if (searchMarker) {
                map.removeLayer(searchMarker);
            }
            
            rolSearchMessageDiv.innerHTML = "";
            coordSearchMessageDiv.innerHTML = "";
            
            // Recorrer las características (polígonos) de la capa
            layer_SUBDIVISIONESAO20232024_2.eachLayer(function(layer) {
                if (layer.feature.properties['ROL'] && layer.feature.properties['ROL'].toString().toLowerCase() === rolInput.toLowerCase()) {
                    // Si el ROL coincide, ajustar la vista del mapa y mostrar el popup
                    map.fitBounds(layer.getBounds());
                    layer.openPopup();
                    found = true;
                    return; // Salir del bucle una vez encontrado
                }
            });

            if (!found) {
                rolSearchMessageDiv.innerHTML = "ROL no encontrado. Intente con otro valor.";
                rolSearchMessageDiv.style.color = 'red';
            }
        }

        function searchCoordinates() {
            var inputString = document.getElementById('coord-input').value.trim();
            var coords = inputString.split(/\s+/).map(Number);

            if (searchMarker) {
                map.removeLayer(searchMarker);
            }
            
            rolSearchMessageDiv.innerHTML = "";
            coordSearchMessageDiv.innerHTML = "";

            if (coords.length !== 2 || isNaN(coords[0]) || isNaN(coords[1]) || coords[0] < -90 || coords[0] > 90 || coords[1] < -180 || coords[1] > 180) {
                coordSearchMessageDiv.innerHTML = "Formato no válido. Ingrese Latitud y Longitud separadas por un espacio.";
                coordSearchMessageDiv.style.color = 'red';
                return;
            }

            var latInput = coords[0];
            var lonInput = coords[1];

            var newCenter = L.latLng(latInput, lonInput);
            map.setView(newCenter, 16);

            searchMarker = L.marker(newCenter).addTo(map)
                .bindPopup(`<b>Coordenadas buscadas</b><br>Lat: ${latInput.toFixed(6)}<br>Lon: ${lonInput.toFixed(6)}`)
                .openPopup();
        }

        setBounds();
    </script>
</body>
</html>
